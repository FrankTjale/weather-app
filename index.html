<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>Weather App</h1>

        <p class="subtitle">
            Check the current weather in any city.
        </p>

        <div class="search-box">

    <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
    >

    <button id="searchButton">
        Search
    </button>

</div>

<button
    class="location-button"
    onclick="useMyLocation()"
>
    📍 Use My Location
</button>

        <section class="weather-card">

            <h2 id="cityName">
                Search for a city
            </h2>

            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

            <p class="temperature" id="temperature">
                --°C
            </p>

            <p id="description">
                Weather information will appear here.
            </p>
            <p class="feels-like">
    Feels like <strong id="feelsLike">--°C</strong>
            </p>

            <div class="weather-details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

            </div>

            <div class="sun-info">

    <div>
        <span>🌅</span>
        <p>Sunrise</p>
        <strong id="sunrise">--:--</strong>
    </div>

    <div>
        <span>🌇</span>
        <p>Sunset</p>
        <strong id="sunset">--:--</strong>
    </div>

    </div>
            <div class="forecast-section">

    <h3>5-Day Forecast</h3>

    <div id="forecast" class="forecast">
        <!-- Forecast cards will be added by JavaScript -->
    </div>

                </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
      </html>
